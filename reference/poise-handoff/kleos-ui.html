#kleos-presence .k-settings{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--k-line);padding:13px 0;font-size:12px;gap:12px}
#kleos-presence .k-settings button{font-size:11px;min-height:38px;padding:8px 11px;border-radius:30px;background:var(--k-well);border:0}
#kleos-presence .k-toast{font-size:12px;line-height:1.4;color:var(--k-softink);min-height:17px;margin:10px 0}
@media(max-width:380px){#kleos-presence .k-stage{padding:42px 2px 24px;min-height:920px}#kleos-presence .k-phone{border-radius:23px}#kleos-presence .k-content{padding:0 18px 20px}#kleos-presence .k-title{font-size:40px}#kleos-presence .k-clothes{gap:5px}#kleos-presence .k-garment{font-size:11px}#kleos-presence .k-bar{padding-left:18px;padding-right:18px}}
@media(pointer:coarse){#kleos-presence .k-chip,#kleos-presence .k-settings button{min-height:44px}}
&lt;/style&gt;
&lt;div id=&quot;kleos-presence&quot; class=&quot;viz-carousel viz-dotted-background&quot; aria-label=&quot;Kleos home directions&quot;&gt;
  &lt;section data-variant=&quot;Occasion-led&quot; aria-label=&quot;Occasion-led Kleos&quot; &gt;
    &lt;div class=&quot;k-stage&quot;&gt;&lt;article class=&quot;k-phone&quot; data-k-phone=&quot;occasion&quot; aria-label=&quot;Occasion-led mobile concept&quot;&gt;
      &lt;div class=&quot;k-status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i data-lucide=&quot;wifi&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i data-lucide=&quot;battery-full&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;header class=&quot;k-bar&quot;&gt;&lt;p class=&quot;k-wordmark&quot;&gt;kleos&lt;/p&gt;&lt;button class=&quot;k-round cursor-interaction&quot; data-action=&quot;poise&quot; aria-label=&quot;Talk to Poise&quot;&gt;&lt;i data-lucide=&quot;audio-lines&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/header&gt;
      &lt;main class=&quot;k-content&quot; aria-live=&quot;polite&quot;&gt;&lt;/main&gt;&lt;nav class=&quot;k-nav&quot; aria-label=&quot;Main navigation&quot;&gt;&lt;/nav&gt;
    &lt;/article&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;section data-variant=&quot;Play-led&quot; aria-label=&quot;Play-led Kleos&quot; hidden&gt;
    &lt;div class=&quot;k-stage&quot;&gt;&lt;article class=&quot;k-phone&quot; data-k-phone=&quot;playful&quot; aria-label=&quot;Play-led mobile concept&quot;&gt;
      &lt;div class=&quot;k-status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span&gt;&lt;i data-lucide=&quot;signal&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i data-lucide=&quot;wifi&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;i data-lucide=&quot;battery-full&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;header class=&quot;k-bar&quot;&gt;&lt;p class=&quot;k-wordmark&quot;&gt;kleos&lt;/p&gt;&lt;button class=&quot;k-round cursor-interaction&quot; data-action=&quot;poise&quot; aria-label=&quot;Talk to Poise&quot;&gt;&lt;i data-lucide=&quot;audio-lines&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;/header&gt;
      &lt;main class=&quot;k-content&quot; aria-live=&quot;polite&quot;&gt;&lt;/main&gt;&lt;nav class=&quot;k-nav&quot; aria-label=&quot;Main navigation&quot;&gt;&lt;/nav&gt;
    &lt;/article&gt;&lt;/div&gt;
  &lt;/section&gt;
&lt;/div&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById('kleos-presence');
const pages=['today','occasion','look','practice','live','read','play','you','wardrobe','poise','aura','duel','farm','profile','library'];
const initial=()=&gt;({page:'today',event:'Dinner with friends',look:'relaxed',saved:false,tone:'Straight',retried:false,preferenceRemoved:false,notice:''});
const states={occasion:initial(),playful:initial()};
const designs={occasion:{theme:'System',radius:16},playful:{theme:'System',radius:16}};
const phones=Array.from(root.querySelectorAll('[data-k-phone]'));
const icon=(name)=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const btn=(text,action,kind='primary',extra='')=&gt;`&lt;button class=&quot;k-${kind} cursor-interaction&quot; data-action=&quot;${action}&quot; ${extra}&gt;${text}&lt;/button&gt;`;
const row=(title,sub,ico,action)=&gt;`&lt;button class=&quot;k-row cursor-interaction&quot; data-action=&quot;${action}&quot;&gt;&lt;span class=&quot;k-token&quot;&gt;${icon(ico)}&lt;/span&gt;&lt;span class=&quot;k-rowtext&quot;&gt;${title}&lt;small&gt;${sub}&lt;/small&gt;&lt;/span&gt;${icon('arrow-up-right')}&lt;/button&gt;`;
const back=(dest='today')=&gt;`&lt;button class=&quot;k-link cursor-interaction&quot; data-action=&quot;${dest}&quot;&gt;${icon('arrow-left')} Back&lt;/button&gt;`;
const title=(label,heading,sub='')=&gt;`&lt;p class=&quot;k-eyebrow&quot;&gt;${label}&lt;/p&gt;&lt;h1 class=&quot;k-title&quot;&gt;${heading}&lt;/h1&gt;${sub?`&lt;p class=&quot;k-sub&quot;&gt;${sub}&lt;/p&gt;`:''}`;
const events=['Dinner with friends','First date','An important room'];
const eventLabel=(s)=&gt;s.event==='First date'?'First date.':s.event==='An important room'?'An important room.':'Dinner with friends.';
const sceneLabel=(s)=&gt;s.event==='First date'?'Let the conversation breathe':s.event==='An important room'?'Hold your point':'Join the conversation';
function garments(s){return `&lt;div class=&quot;k-clothes&quot;&gt;&lt;div class=&quot;k-garment&quot;&gt;${icon('shirt')}&lt;span&gt;${s.look==='relaxed'?'Ivory knit':'White shirt'}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;k-garment&quot;&gt;${icon('columns-2')}&lt;span&gt;Charcoal&lt;br&gt;trousers&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;k-garment&quot;&gt;${icon('footprints')}&lt;span&gt;${s.look==='relaxed'?'Brown loafers':'Black loafers'}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;}
function outfit(s){return `&lt;div class=&quot;k-look&quot;&gt;${garments(s)}&lt;p class=&quot;k-eyebrow&quot;&gt;FROM YOUR WARDROBE · THREE PIECES&lt;/p&gt;&lt;h2 class=&quot;k-looktitle&quot;&gt;${s.look==='relaxed'?'Relaxed, considered.':'A little more composed.'}&lt;/h2&gt;&lt;p&gt;${s.look==='relaxed'?'The soft knit keeps this easy. Charcoal trousers give it structure.':'A crisp shirt makes the same trousers feel more formal.'}&lt;/p&gt;&lt;/div&gt;`;}
function home(s,key){
if(key==='playful')return `${title('THE ART OF SHOWING UP','A little presence.&lt;br&gt;A little &lt;em&gt;audacity.&lt;/em&gt;')}&lt;div class=&quot;k-hero&quot;&gt;&lt;span class=&quot;k-monogram&quot; aria-hidden=&quot;true&quot;&gt;κ&lt;/span&gt;&lt;p class=&quot;k-eyebrow&quot;&gt;THE AURA CAMERA&lt;/p&gt;&lt;h2&gt;You asked&lt;br&gt;for the read.&lt;/h2&gt;${btn('Let Poise have a look '+icon('arrow-up-right'),'aura','invert')}&lt;/div&gt;&lt;div class=&quot;k-grid&quot;&gt;&lt;button class=&quot;k-mode cursor-interaction&quot; data-action=&quot;duel&quot;&gt;${icon('swords')}Debate Duel&lt;small&gt;Make your case.&lt;/small&gt;&lt;/button&gt;&lt;button class=&quot;k-mode cursor-interaction&quot; data-action=&quot;play&quot;&gt;${icon('users')}With friends&lt;small&gt;Pass the phone.&lt;/small&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;k-headingrow&quot;&gt;&lt;h3&gt;Something real coming up?&lt;/h3&gt;&lt;/div&gt;${row(eventLabel(s),'Your look. Your moment. Your way.','calendar-days','occasion')}`;
return `${title('YOUR EVENING, CONSIDERED','How are you&lt;br&gt;&lt;em&gt;showing up?&lt;/em&gt;')}&lt;div class=&quot;k-hero&quot;&gt;&lt;span class=&quot;k-monogram&quot; aria-hidden=&quot;true&quot;&gt;κ&lt;/span&gt;&lt;p class=&quot;k-eyebrow&quot;&gt;TONIGHT · YOUR OCCASION&lt;/p&gt;&lt;h2&gt;${eventLabel(s)}&lt;/h2&gt;&lt;p class=&quot;k-sub&quot;&gt;Look the part.&lt;br&gt;Feel ready to join in.&lt;/p&gt;${btn('Get ready '+icon('arrow-up-right'),'occasion','invert')}&lt;/div&gt;&lt;div class=&quot;k-headingrow&quot;&gt;&lt;h3&gt;A little practice. A little play.&lt;/h3&gt;&lt;/div&gt;${row('The daily situation','Someone interrupts your story.','message-circle','practice')}${row('The aura camera','A read, a roast, a way forward.','camera','aura')}${row('Your wardrobe','Make more of what you own.','shirt','wardrobe')}`;
}
function content(s,key){switch(s.page){
case 'today':return home(s,key);
case 'occasion':return `${back()}${title('YOUR OCCASION',eventLabel(s),'An outfit you feel like yourself in. One moment worth practising.')}&lt;div class=&quot;k-chips&quot;&gt;${events.map(e=&gt;`&lt;button class=&quot;k-chip cursor-interaction&quot; data-action=&quot;event&quot; data-event=&quot;${e}&quot; aria-pressed=&quot;${s.event===e}&quot;&gt;${e}&lt;/button&gt;`).join('')}&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;THE IMPRESSION YOU CHOSE&lt;/small&gt;&lt;p&gt;Relaxed. Thoughtful. Still you.&lt;/p&gt;&lt;/div&gt;${row('Build your look',s.saved?'Look saved · change it anytime':'Two options from your wardrobe','shirt','look')}${row('Practise the moment',sceneLabel(s)+' · 90 seconds','audio-lines','practice')}&lt;div class=&quot;k-headingrow&quot;&gt;&lt;h3&gt;Poise’s thought&lt;/h3&gt;&lt;/div&gt;&lt;p class=&quot;k-sub&quot;&gt;You don’t need a new personality for tonight. Give yourself an easier first minute.&lt;/p&gt;${btn('Build my look','look')}`;
case 'look':return `${back('occasion')}${title('THE LOOK','Already yours.','Two ways to wear what you have.')}&lt;div class=&quot;k-chips&quot;&gt;&lt;button class=&quot;k-chip cursor-interaction&quot; data-action=&quot;look-relaxed&quot; aria-pressed=&quot;${s.look==='relaxed'}&quot;&gt;More relaxed&lt;/button&gt;&lt;button class=&quot;k-chip cursor-interaction&quot; data-action=&quot;look-sharp&quot; aria-pressed=&quot;${s.look==='sharp'}&quot;&gt;More formal&lt;/button&gt;&lt;/div&gt;${outfit(s)}${btn(s.saved?'Look saved '+icon('check'):'Wear this','save-look')}&lt;div class=&quot;k-toast&quot; role=&quot;status&quot;&gt;${s.notice}&lt;/div&gt;${btn('Practise for '+(s.event==='Dinner with friends'?'dinner':s.event==='First date'?'the date':'the room')+' '+icon('arrow-right'),'practice','secondary')}&lt;button class=&quot;k-link cursor-interaction&quot; data-action=&quot;swap&quot;&gt;${icon('refresh-cw')} Try the other combination&lt;/button&gt;`;
case 'practice':return `${back('occasion')}${title('PRACTISE THE MOMENT',sceneLabel(s)+'.','A short conversation. One thing to work on.')}&lt;div class=&quot;k-person&quot;&gt;&lt;span class=&quot;k-seal&quot; aria-hidden=&quot;true&quot;&gt;M&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Mara&lt;/h3&gt;&lt;p&gt;Warm, curious.&lt;br&gt;Not here to do all the talking.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;YOUR PRACTICE TARGET&lt;/small&gt;&lt;p&gt;Make your point, then leave room for a reply.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;k-steps&quot;&gt;&lt;span&gt;90 seconds&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;Gentle pushback&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;Camera optional&lt;/span&gt;&lt;/div&gt;${btn('Start the scene '+icon('mic'),'live')}&lt;div class=&quot;k-space&quot;&gt;&lt;/div&gt;${btn('See a sample read','read','secondary')}&lt;p class=&quot;k-small&quot;&gt;Your look stays saved. You can come back to it after the call.&lt;/p&gt;`;
case 'live':return `${back('practice')}&lt;p class=&quot;k-eyebrow&quot;&gt;${s.retried?'ANOTHER WAY IN':'JOINING THE TABLE'}&lt;/p&gt;&lt;div class=&quot;k-person&quot;&gt;&lt;span class=&quot;k-seal&quot; aria-hidden=&quot;true&quot;&gt;M&lt;/span&gt;&lt;div&gt;&lt;h3&gt;Mara&lt;/h3&gt;&lt;p&gt;At the table&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;blockquote class=&quot;k-quote&quot;&gt;${s.retried?'“What made you pick that?”':'“So, what have you been working on lately?”'}&lt;/blockquote&gt;&lt;div class=&quot;k-meter&quot; aria-label=&quot;Illustrative voice waveform&quot;&gt;${[12,20,32,18,44,56,34,22,45,30,48,59,35,18,27,42,16,9].map(h=&gt;`&lt;span style=&quot;height:${h}px&quot;&gt;&lt;/span&gt;`).join('')}&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;THIS IS YOUR MOMENT&lt;/small&gt;&lt;p&gt;Answer in your own words. You don’t need a perfect line.&lt;/p&gt;&lt;/div&gt;${btn('Finish and see the read','read')}&lt;p class=&quot;k-small&quot;&gt;Interactive concept · no microphone is recording.&lt;/p&gt;`;
case 'read':return `${back('practice')}${title('POISE · THE READ',s.retried?'A different&lt;br&gt;way through.':'There’s your&lt;br&gt;&lt;em&gt;opening.&lt;/em&gt;')}&lt;div class=&quot;k-settings&quot;&gt;&lt;span&gt;Your read&lt;/span&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;tone&quot;&gt;${s.tone} ${icon('chevron-down')}&lt;/button&gt;&lt;/div&gt;&lt;blockquote class=&quot;k-quote&quot;&gt;“It’s probably not that interesting, but…”&lt;/blockquote&gt;&lt;div class=&quot;k-proof&quot;&gt;${icon('play')} Your opening · 00:08&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;ONE CHANGE&lt;/small&gt;&lt;p&gt;${s.tone==='Unfiltered'?'You gave your story a bad review before anyone heard it. Start with the actual story.':'You dismissed your answer before sharing it. Try leading with the part you found interesting.'}&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;k-sub&quot;&gt;Example: “I’ve been working on a project that…”&lt;/p&gt;${btn('Retry this moment '+icon('rotate-ccw'),'retry')}&lt;div class=&quot;k-space&quot;&gt;&lt;/div&gt;${btn('Back to my evening','occasion','secondary')}&lt;p class=&quot;k-small&quot;&gt;Illustrative feedback. A real retry can improve, stay similar or be harder.&lt;/p&gt;`;
case 'play':return `${title('A LITTLE SOCIAL SPORT','Make it&lt;br&gt;&lt;em&gt;interesting.&lt;/em&gt;','A private read or a room full of witnesses. Your choice.')}&lt;div class=&quot;k-grid&quot;&gt;${[['camera','Aura camera','The read you asked for.','aura'],['users','Farm-off','Pass it around.','farm'],['swords','Debate Duel','Make your case.','duel'],['audio-lines','Open Floor','Find your way into the room.','practice'],['shirt','Fit Check','Keep the look. Fix the detail.','look'],['contact','Profile read','How your page comes across.','profile']].map(m=&gt;`&lt;button class=&quot;k-mode cursor-interaction&quot; data-action=&quot;${m[3]}&quot;&gt;${icon(m[0])}${m[1]}&lt;small&gt;${m[2]}&lt;/small&gt;&lt;/button&gt;`).join('')}&lt;/div&gt;&lt;div class=&quot;k-headingrow&quot;&gt;&lt;h3&gt;Something coming up?&lt;/h3&gt;&lt;/div&gt;${row('Turn a read into a plan','Build a look. Practise the moment.','arrow-up-right','occasion')}`;
case 'you':return `${title('THE THINGS THAT MAKE IT YOURS','Your taste.&lt;br&gt;Your practice.')}&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;YOUR CURRENT DIRECTION&lt;/small&gt;&lt;p&gt;${s.preferenceRemoved?'Choose your style direction.':'Relaxed silhouettes.'}&lt;br&gt;Clearer openings.&lt;/p&gt;&lt;/div&gt;${row('Wardrobe','Your pieces, more possibilities.','shirt','wardrobe')}${row('Practice &amp; progress','Specific moments. Useful patterns.','chart-no-axes-combined','read')}${row('Your Portrait','What Poise has noticed, with context.','book-open','poise')}${row('The full collection','Path, Situations, missions &amp; more.','grid-2x2','library')}&lt;div class=&quot;k-settings&quot;&gt;&lt;span&gt;Poise’s tone&lt;/span&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;tone&quot;&gt;${s.tone}&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;k-settings&quot;&gt;&lt;span&gt;What Poise remembers&lt;/span&gt;&lt;button class=&quot;cursor-interaction&quot; data-action=&quot;poise&quot;&gt;View &amp; edit&lt;/button&gt;&lt;/div&gt;`;
case 'wardrobe':return `${back('you')}${title('YOUR WARDROBE','Good pieces.&lt;br&gt;&lt;em&gt;Better together.&lt;/em&gt;','A few favourites from your wardrobe.')}&lt;div class=&quot;k-look&quot;&gt;${garments(s)}&lt;div class=&quot;k-clothes&quot;&gt;&lt;div class=&quot;k-garment&quot;&gt;${icon('shirt')}&lt;span&gt;Navy jacket&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;k-garment&quot;&gt;${icon('shirt')}&lt;span&gt;White tee&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;k-garment&quot;&gt;${icon('columns-2')}&lt;span&gt;Dark denim&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${btn('Build a look for my occasion','look')}&lt;div class=&quot;k-space&quot;&gt;&lt;/div&gt;${btn('My style preferences','poise','secondary')}&lt;p class=&quot;k-small&quot;&gt;Schematic sample inventory. The app would show your own garment photos.&lt;/p&gt;`;
case 'poise':return `${back()}${title('POISE','Let’s make&lt;br&gt;it feel like &lt;em&gt;you.&lt;/em&gt;')}&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;FOR YOUR EVENING&lt;/small&gt;&lt;p&gt;We have a look. Shall we practise your first minute at the table?&lt;/p&gt;&lt;/div&gt;${row('Build the look first','Use the pieces I already own.','shirt','look')}${row('Practise the opening','A short scene with Mara.','audio-lines','practice')}&lt;div class=&quot;k-headingrow&quot;&gt;&lt;h3&gt;What you’ve told Poise&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;${s.preferenceRemoved?'&lt;p&gt;No saved style preference.&lt;/p&gt;':`&lt;p&gt;You prefer relaxed outfits.&lt;/p&gt;&lt;p class=&quot;k-small&quot;&gt;A preference you can change.&lt;/p&gt;&lt;button class=&quot;k-link cursor-interaction&quot; data-action=&quot;forget&quot;&gt;${icon('x')} Remove this preference&lt;/button&gt;`}&lt;/div&gt;&lt;div class=&quot;k-toast&quot; role=&quot;status&quot;&gt;${s.notice}&lt;/div&gt;`;
case 'aura':return `${back('play')}${title('THE AURA CAMERA','The read.&lt;br&gt;The &lt;em&gt;next move.&lt;/em&gt;','A look or a performance. You choose what gets read.')}&lt;div class=&quot;k-hero&quot;&gt;&lt;p class=&quot;k-eyebrow&quot;&gt;A PLAYFUL OUTFIT READ&lt;/p&gt;&lt;div class=&quot;k-float&quot; aria-hidden=&quot;true&quot;&gt;κ&lt;/div&gt;&lt;h2&gt;The outfit has a point of view.&lt;/h2&gt;&lt;p class=&quot;k-sub&quot;&gt;Now give it somewhere to go.&lt;/p&gt;&lt;/div&gt;${btn('Build a look for tonight','look')}&lt;div class=&quot;k-space&quot;&gt;&lt;/div&gt;${btn('Try a conversation read','practice','secondary')}&lt;p class=&quot;k-small&quot;&gt;Sample result · camera controls and recording are outside this concept.&lt;/p&gt;`;
case 'farm':return `${back('play')}${title('FARM-OFF','Pass it&lt;br&gt;&lt;em&gt;around.&lt;/em&gt;','Two to eight people. Fifteen seconds each.')}&lt;div class=&quot;k-hero&quot;&gt;&lt;p class=&quot;k-eyebrow&quot;&gt;THE PROMPT&lt;/p&gt;&lt;h2&gt;Tell us a story&lt;br&gt;you always&lt;br&gt;tell badly.&lt;/h2&gt;&lt;p class=&quot;k-sub&quot;&gt;One take. A card for each player.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;YOUR ROUND, YOUR CHOICE&lt;/small&gt;&lt;p&gt;Each player chooses whether to save or share their card.&lt;/p&gt;&lt;/div&gt;${btn('Explore another game','play')}&lt;p class=&quot;k-small&quot;&gt;A playful round, separate from your practice progress.&lt;/p&gt;`;
case 'profile':return `${back('you')}${title('YOUR PROFILE','A considered&lt;br&gt;&lt;em&gt;first impression.&lt;/em&gt;','A read of what you choose to show.')}&lt;div class=&quot;k-note&quot;&gt;&lt;small&gt;THE SAMPLE READ&lt;/small&gt;&lt;p&gt;Your photos show a point of view. Your bio could give someone an easier way into a conversation.&lt;/p&gt;&lt;/div&gt;&lt;blockquote class=&quot;k-quote&quot;&gt;One detail someone can ask you about.&lt;/blockquote&gt;${btn('Talk it through with Poise','poise')}&lt;div class=&quot;k-space&quot;&gt;&lt;/div&gt;${btn('Explore the playful reads','play','secondary')}&lt;p class=&quot;k-small&quot;&gt;Illustrative profile feedback. No account is connected.&lt;/p&gt;`;
case 'duel':return `${back('play')}${title('DEBATE DUEL','Have something&lt;br&gt;to &lt;em&gt;say.&lt;/em&gt;')}&lt;div class=&quot;k-hero&quot;&gt;&lt;p class=&quot;k-eyebrow&quot;&gt;TONIGHT’S MOTION&lt;/p&gt;&lt;h2&gt;Being interesting&lt;br&gt;is better than&lt;br&gt;being impressive.&lt;/h2&gt;&lt;p class=&quot;k-sub&quot;&gt;Two people. Forty-five seconds each.&lt;/p&gt;&lt;/div&gt;${btn('Practise my argument','practice')}&lt;div class=&quot;k-space&quot;&gt;&lt;/div&gt;${btn('Back to the games','play','secondary')}&lt;p class=&quot;k-small&quot;&gt;Game verdicts stay separate from your practice progress.&lt;/p&gt;`;
case 'library':return `${back('you')}${title('THE COLLECTION','Find your&lt;br&gt;next &lt;em&gt;move.&lt;/em&gt;')}${row('The Presence Path','Lessons, Laurels and checkpoints.','route','practice')}${row('Live rooms &amp; side quests','Dates, stories, pushback and more.','door-open','practice')}${row('Open Floor','Several voices. Your place in the room.','users','practice')}${row('Situations &amp; Codes','Small decisions. Useful perspectives.','book-open','practice')}${row('Field missions &amp; receipts','Take it outside. Bring it to Poise.','receipt','poise')}${row('Profile read','Give your page a considered second look.','contact','profile')}`;
default:return home(s,key);
}}
function navPage(page){return ['play','aura','duel','farm'].includes(page)?'play':['you','wardrobe','library'].includes(page)?'you':'today';}
