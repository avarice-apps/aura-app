<body>

<section class="ent" id="ent" aria-label="Members' entrance">
  <div class="pic" role="img" aria-label="A portrait after Sargent in Kleos blue"><a href="index.html">Kleos</a></div>
  <div class="box">
    <h1>Members</h1>
    <p>Your app, on a bigger screen: your Index, your reads, your plan and your number on the register. Use the email you saved in the app (You › Account).</p>
    <form id="ef" novalidate>
      <label class="sr" for="ee">Email</label>
      <input id="ee" type="email" placeholder="Your email" autocomplete="email">
      <label class="sr" for="ec">Six-digit code</label>
      <input id="ec" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Six-digit code" hidden>
      <button class="btn fill" id="eb" type="submit">Email me a code</button>
      <div class="msg" id="em" role="status" aria-live="polite"></div>
    </form>
    <div class="or">or</div>
    <button class="btn" id="demo" type="button">Look around as a sample member</button>
    <a class="note" href="index.html" style="color:var(--ink2)">Back to Kleos</a>
  </div>
</section>

<div class="app" id="app">
  <aside class="rail" aria-label="Members">
    <a class="brand" href="index.html"><b>Kleos</b><span>Members</span></a>
    <div class="me"><div class="av" aria-hidden="true"></div><div><div class="nm" id="mnm">Theo</div><div class="tr" id="mtr">Kleos Black · Nº 0087</div></div></div>
    <nav class="menu" id="menu"></nav>
    <div class="bottom">
      <span class="tiny">Preview as</span>
      <div class="seg" id="seg"><button data-t="free">Free</button><button data-t="plus">Kleos+</button><button data-t="black">Black</button></div>
      <span class="tiny">Synced from the app 2 minutes ago</span>
      <button class="out" id="out">Sign out</button>
    </div>
  </aside>
  <div class="mtop"><div class="row"><a href="index.html" style="text-decoration:none"><b>Kleos</b></a><span id="mtr2">Black · Nº 0087</span></div><nav id="mnav"></nav></div>
  <main id="main" tabindex="-1"></main>
</div>

<script src="k.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const S = K.store;
const VIEWS_ALL = [
  ['g','From the app',''],
  ['overview','Overview',''], ['replays','Replays',''], ['patterns','Patterns',''],
  ['g','Only here',''],
  ['sessions','Sessions','Soon'], ['wardrobe','Wardrobe',''], ['issued','Issued',''], ['league','League',''], ['dispatch','Dispatch','']
];
const NEED = { wardrobe:'black', league:'plus' };
const TIERNAME = { free:'Free', plus:'Kleos+', black:'Kleos Black' };
let tier = S.get('kleos.tier','black');
const rank = t => ({ free:0, plus:1, black:2 })[t];
const can = need => rank(tier) >= rank(need || 'free');

// ---------- sample member data (mirrors what the app stores) ----------
const D = {
  name:'Theo', no:87,
  index:[58,57,59,61,62,63,62,66,67,69,70,74], events:{3:'First date',7:'Interview',11:'Toast'},
  axes:[['Voice',71,66],['Command',68,61],['Composure',80,77],['Awareness',66,64],['Landed',77,70]],
  reads:[
    { id:1, mode:'Live', title:'The maître d’, no table', when:'Today, 19:12', dur:'3:02', score:74, verdict:'You held the ask. You gave it away on the apology.',
      turn:{ at:'1:14', q:'Sorry, I know it’s a lot to ask.', what:'He stopped looking for a way to help and started looking for a way out.' },

// ---------- charts ----------
function lineChart(vals, { w=640, h=200, min=50, max=86, mark=80, markLabel='Laurel Cap', events={}, dates=['Jul','Aug','Sep','Oct'] }={}) {
  const pl=8, pr=40, pt=16, pb=26, W=w-pl-pr, H=h-pt-pb;
  const x=i=>pl+i*(W/(vals.length-1)), y=v=>pt+H-(v-min)/(max-min)*H;
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const area=d+` L${x(vals.length-1)} ${pt+H} L${x(0)} ${pt+H} Z`;
  const ev=Object.entries(events).map(([i,l])=>`<circle cx="${x(+i)}" cy="${y(vals[+i])}" r="4" fill="#fff" stroke="#0D0B1E" stroke-width="1.5"/><text x="${x(+i)}" y="${y(vals[+i])-12}" text-anchor="middle" font-size="11" fill="#6B6880">${l}</text>`).join('');
  const last=vals.length-1;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Aura Index over twelve weeks, from ${vals[0]} to ${vals[last]}">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1608F2" stop-opacity=".14"/><stop offset="1" stop-color="#1608F2" stop-opacity="0"/></linearGradient></defs>
    ${mark?`<line x1="${pl}" x2="${pl+W}" y1="${y(mark)}" y2="${y(mark)}" stroke="#0D0B1E" stroke-opacity=".3" stroke-dasharray="3 4"/><text x="${pl+W+6}" y="${y(mark)+4}" font-size="11" fill="#6B6880">${mark}</text><text x="${pl+W-4}" y="${y(mark)-6}" font-size="11" fill="#6B6880" text-anchor="end">${markLabel}</text>`:''}
    <path d="${area}" fill="url(#ga)"/><path d="${d}" fill="none" stroke="#1608F2" stroke-width="2.5" stroke-linejoin="round"/>
    ${ev}<circle cx="${x(last)}" cy="${y(vals[last])}" r="5.5" fill="#1608F2"/><text x="${x(last)+10}" y="${y(vals[last])+5}" font-size="13" font-weight="600" fill="#0D0B1E">${vals[last]}</text>
    ${dates.map((m,i)=>`<text x="${pl+i*(W/(dates.length-1))}" y="${h-6}" font-size="11" fill="#6B6880" text-anchor="${i===0?'start':i===dates.length-1?'end':'middle'}">${m}</text>`).join('')}
  </svg>`;
}

   <div class="cols2"><div><h3>The Index rose six.</h3><p>From 68 to 74, mostly on Composure. You took eleven reads this week, four of them live.</p>${lineChart(D.index.slice(-6),{w:320,h:130,min:60,max:82,mark:80,dates:['Sep','Oct']})}</div>
   <div><h3>Your best minute</h3><p>Saturday, the rooftop story. You waited a full second before “and then the lights went out.” That second was the laugh.</p><h3>One thing</h3><p>Speeding up when challenged. Next time someone pushes, finish your sentence at the same pace you started it.</p></div></div>
   <h3>This week’s Side Quests</h3><p>Monday, order for the table. Wednesday, hold eye contact through a whole toast. Friday, send something back politely.</p>
   <p class="muted" style="margin-top:22px;font-size:13px">Kleos · Saint-Tropez · Paris · Madrid · London · New York</p></article>`;

// ---------- a real member (signed in with an emailed code; the session is an httpOnly cookie) ----------
let REAL = null;
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const api = (path, body, extra={}) => fetch(path, { method: body ? 'POST' : 'GET', credentials: 'same-origin', headers: body ? { 'Content-Type':'application/json', ...extra } : extra, body: body ? JSON.stringify(body) : undefined });
async function loadAccount() {
  try {
    const r = await api('/account');
    if (!r.ok) return null;
    const a = await r.json();
    return a && a.saved ? a : null;
  } catch (_) { return null; }
}
const REAL_VIEWS = [['g','From the app',''], ['overview','Overview',''], ['replays','Reads',''], ['account','Account','']];
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', { day:'numeric', month:'short' }); };
const R = {};
R.overview = () => {
  const a = REAL, sm = a.summary || {}, h = new Date().getHours();
  const hello = h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  const name = esc(a.name || (a.email||'').split('@')[0] || 'there');
  const left = a.plan==='free' ? `${a.left?.calls ?? 0} free call${a.left?.calls===1?'':'s'}` : (a.live_min_left!=null ? `${a.live_min_left} live minutes` : 'Open');
  const recent = (sm.recent || []).filter(r => r && r.title);
  return `<div class="ph1"><div><h1>${hello}, ${name}.</h1><div class="d">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})} · ${TIERNAME[a.plan]||'Free'}${a.waitlist_no?` · ${fmtNo(a.waitlist_no)}`:''}</div></div></div>
  ${a.summary ? '' : `<section class="pn"><div class="hd"><h2>Nothing synced yet</h2></div><p class="muted" style="margin:0">Open Kleos on your phone once while you’re signed in, and your Index and reads appear here.</p></section><div class="gap"></div>`}
  <div class="g2">
    <section class="pn" aria-labelledby="h-ix"><div class="hd"><h2 id="h-ix">Aura Index</h2><span>From the app</span></div>
      <div class="ix"><div><div class="lbl">Now</div><div class="big">${sm.index ?? '—'}</div><div class="delta">${sm.archetype ? 'Reads as '+esc(sm.archetype) : ''}</div></div><div></div></div>
      <div class="stats"><div><span>Calls read</span><b>${Number(sm.sessions)||0}</b></div><div><span>Laurels</span><b>${Number(sm.laurels)||0}</b></div><div><span>Streak</span><b>${Number(sm.streak)||0}</b><em>days</em></div><div><span>Left this week</span><b style="font-size:20px">${esc(left)}</b></div></div>
    </section>
    <section class="pn want" aria-labelledby="h-w"><div class="hd"><h2 id="h-w">Next</h2></div>
      <a href="#account"><div class="t">Your plan</div><div class="h">${TIERNAME[a.plan]||'Free'}</div><div class="n">${a.plan==='free'?'Kleos+ opens every scene and Rehearse.':'Thanks for being here.'}</div></a>
      ${a.waitlist_no?`<a href="#account"><div class="t">The register</div><div class="h">${fmtNo(a.waitlist_no)}</div><div class="n">Your number from the waitlist. It stays yours.</div></a>`:''}
    </section>
  </div>
  <div class="gap"></div>
  <section class="pn" aria-labelledby="h-rr"><div class="hd"><h2 id="h-rr">Recent reads</h2><a href="#replays">All</a></div>
    ${recent.length ? `<table class="t"><thead><tr><th>Read</th><th>When</th><th style="text-align:right">Score</th></tr></thead><tbody>${recent.slice(0,6).map(r=>`<tr><td>${esc(r.title)}</td><td class="muted">${when(r.at)}</td><td class="num">${r.rating ?? '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted" style="margin:0">Your reads show up here after your first call.</p>'}
  </section>`;
};
R.replays = () => {
  const recent = ((REAL.summary||{}).recent || []).filter(r => r && r.title);
  return `<div class="ph1"><div><h1>Reads</h1><div class="d">The latest from the app. Full replays, with the moment it turned, live in the app for now.</div></div></div>
  <section class="pn">${recent.length ? `<table class="t"><thead><tr><th>Read</th><th>When</th><th style="text-align:right">Score</th></tr></thead><tbody>${recent.map(r=>`<tr><td>${esc(r.title)}</td><td class="muted">${when(r.at)}</td><td class="num">${r.rating ?? '—'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted" style="margin:0">Nothing yet.</p>'}</section>`;
};
R.account = () => {
  const a = REAL;
  const until = a.plan_until ? new Date(a.plan_until*1000).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}) : '';
  return `<div class="ph1"><div><h1>Account</h1><div class="d">Saved ${a.email?'with '+esc(a.email):'with Apple'}${a.email&&a.apple?', also linked to Apple':''}.</div></div></div>
  <section class="pn"><table class="t"><tbody>
    <tr><td>Plan</td><td class="num">${TIERNAME[a.plan]||'Free'}${until?` · renews or ends ${until}`:''}</td></tr>
    <tr><td>The register</td><td class="num">${a.waitlist_no?fmtNo(a.waitlist_no):'Not on the waitlist'}</td></tr>
    <tr><td>Subscription</td><td class="num">Managed on your iPhone: Settings › Apple ID › Subscriptions</td></tr>
  </tbody></table>
  <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap"><button class="bt" id="rout">Sign out here</button><button class="bt" id="rdel">Delete my account</button></div>
  <p class="muted" style="margin:14px 0 0;font-size:13px">Deleting removes the account and everything our server keeps for it. A subscription isn’t cancelled by this; cancel it on your iPhone.</p></section>`;
};

// ---------- router ----------
const routes = () => (REAL ? REAL_VIEWS : VIEWS_ALL).filter(v=>v[0]!=='g').map(v=>v[0]);
function menu(cur) {
  const VIEWS = REAL ? REAL_VIEWS : VIEWS_ALL;
  $('#seg').parentElement.querySelectorAll('.tiny, #seg').forEach(el => el.style.display = REAL ? 'none' : '');
  $('#menu').innerHTML = VIEWS.map(([k,l,s])=> k==='g' ? `<span class="grp">${l}</span>` : `<a href="#${k}" ${k===cur?'aria-current="page"':''}><span>${l}</span>${s?`<small>${s}</small>`:(NEED[k]&&!can(NEED[k])?`<small>${TIERNAME[NEED[k]]}</small>`:'')}</a>`).join('');
  $('#mnav').innerHTML = VIEWS.filter(v=>v[0]!=='g').map(([k,l])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}>${l}</a>`).join('');
  const cur2 = $('#mnav [aria-current]'); if (cur2) cur2.scrollIntoView({ inline:'center', block:'nearest' });
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.t===tier)); $('#seg').style.setProperty('--i', rank(tier));
  const no = REAL ? REAL.waitlist_no : D.no;
  const label = `${TIERNAME[tier]}${no ? ' · ' + fmtNo(no) : ''}`;
  $('#mtr').textContent = label; $('#mtr2').textContent = label;
  $('#mnm').textContent = REAL ? (REAL.name || (REAL.email||'').split('@')[0] || 'Member') : D.name;
}
function render(focus) {
  let r = location.hash.slice(1); if (!routes().includes(r)) r = 'overview';
  menu(r); $('#main').innerHTML = (REAL ? R : V)[r](); wire(r); if (focus) { $('#main').focus({ preventScroll:true }); scrollTo(0,0); }
  document.title = 'Kleos · ' + ((REAL ? REAL_VIEWS : VIEWS_ALL).find(v=>v[0]===r)||[])[1];
}
function wire(r) {
  document.querySelectorAll('tr.click[data-r]').forEach(tr=>tr.onclick=()=>{ selRead=+tr.dataset.r; cmpSel.clear(); location.hash='replays'; });
  document.querySelectorAll('.ri[data-r]').forEach(el=>el.onclick=e=>{ if (!el.dataset.r || e.target.matches('input')) return; selRead=+el.dataset.r; cmpSel.clear(); render(); });
  document.querySelectorAll('.ri input[data-c]').forEach(c=>c.onchange=()=>{ const id=+c.dataset.c; if (c.checked){ if (cmpSel.size>=2) cmpSel.delete([...cmpSel][0]); cmpSel.add(id); } else cmpSel.delete(id); render(); });
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{ modeF=b.dataset.m; render(); });
  const clr=$('#clr'); if (clr) clr.onclick=()=>{ cmpSel.clear(); render(); };
  document.querySelectorAll('.occ button').forEach(b=>b.onclick=()=>{ occ=b.dataset.o; render(); });
  document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>{ const k='kleos.seat'+b.dataset.seat; const v=!S.get(k,false); S.set(k,v); K.toast(v?'Seat held. We’ll email you when booking opens.':'Seat released'); render(); });
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{ try { await navigator.clipboard.writeText(b.dataset.copy); K.toast('Copied '+b.dataset.copy); } catch(_) { K.toast(b.dataset.copy); } });
  document.querySelectorAll('[data-repair]').forEach(b=>b.onclick=()=>K.toast('We’ll email a prepaid label for '+b.dataset.repair));
  document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>K.toast(b.dataset.toast));
  const pr=$('#print'); if (pr) pr.onclick=()=>print();
  const ro=$('#rout'); if (ro) ro.onclick=signOut;
  const rd=$('#rdel'); if (rd) rd.onclick=async()=>{
    if (!confirm('Delete your Kleos account? This removes the account and everything our server keeps for it. It can’t be undone.')) return;
    const res = await api('/account/delete', {});
    if (res.ok) { K.toast('Your account is deleted.'); signOut(true); } else K.toast('Couldn’t delete it. Try again, or delete it in the app.');
  };
}
function enter() { $('#ent').style.display='none'; $('#app').classList.add('on'); render(true); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) $('#main').animate([{ opacity:0, transform:'translateY(8px)' }, { opacity:1, transform:'none' }], { duration:420, easing:'cubic-bezier(0.23, 1, 0.32, 1)' }); }
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ if (REAL) return; tier=b.dataset.t; S.set('kleos.tier',tier); render(); });
addEventListener('hashchange', ()=>{ if ($('#app').classList.contains('on')) render(true); });
$('#demo').onclick = () => { REAL=null; S.set('kleos.member','sample'); enter(); };
async function signOut(skipServer) {
  if (REAL && skipServer !== true) { try { await api('/auth/logout', {}); } catch (_) {} }
  REAL = null; S.set('kleos.member',null); tier = S.get('kleos.tier','black');
  $('#app').classList.remove('on'); $('#ent').style.display='';
  resetEntrance();
  try{history.replaceState(null,'',location.pathname);}catch(_){}
}
$('#out').onclick = () => signOut();
let pendingEmail = '';
function resetEntrance() { pendingEmail=''; $('#ec').hidden=true; $('#ec').value=''; $('#ee').hidden=false; $('#eb').textContent='Email me a code'; $('#em').textContent=''; }
$('#ef').onsubmit = async e => {
  e.preventDefault(); const m=$('#em'); const b=$('#eb');
  if (!pendingEmail) {
    const v=$('#ee').value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(v)) { m.textContent='That doesn’t look like an email.'; return; }
    b.disabled=true; m.textContent='Sending…';
    try {
      const r = await api('/auth/email/start', { email: v });
      const j = await r.json().catch(()=>({}));
      if (!r.ok) { m.textContent = j.detail || 'Couldn’t send a code. Try again in a minute.'; return; }
      pendingEmail=v; $('#ee').hidden=true; $('#ec').hidden=false; $('#ec').focus(); b.textContent='Sign in';
      m.textContent=`We sent a six-digit code to ${v}. It works for 15 minutes.`;
    } catch (_) { m.textContent='Couldn’t reach Kleos. Try again.'; }
    finally { b.disabled=false; }
    return;
  }
  const code=$('#ec').value.replace(/\D/g,'');
  if (code.length!==6) { m.textContent='The code is six digits.'; return; }
  b.disabled=true; m.textContent='Checking…';
  try {
    const r = await api('/auth/email/verify', { email: pendingEmail, code }, { 'x-kleos-web':'1' });
    const j = await r.json().catch(()=>({}));
    if (!r.ok) { m.textContent = j.detail || 'That code didn’t work.'; $('#ec').value=''; return; }
    const a = await loadAccount();
    if (!a) { m.textContent='Signed in, but there’s nothing here yet. Save your account in the app with this email.'; return; }
    REAL=a; tier=a.plan||'free'; S.set('kleos.member',null); enter();
  } catch (_) { m.textContent='Couldn’t reach Kleos. Try again.'; }
  finally { b.disabled=false; }
};
$('#ec').oninput = () => { const c=$('#ec').value.replace(/\D/g,'').slice(0,6); $('#ec').value=c; if (c.length===6) $('#ef').requestSubmit(); };
(async () => {
  const a = await loadAccount();
  if (a) { REAL=a; tier=a.plan||'free'; enter(); return; }
  if (S.get('kleos.member',null)) enter();
})();
})();
</script>
</body>
</html>
